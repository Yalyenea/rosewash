<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosewash</title>
    <link rel="stylesheet" href="src/popup/popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topline">
        <div>
          <h1>Rosewash</h1>
          <p id="host">current site</p>
        </div>
        <label class="switch" aria-label="Enable Rosewash">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="modes" aria-label="Appearance">
        <button type="button" data-appearance="auto">Auto</button>
        <button type="button" data-appearance="light">Light</button>
        <button type="button" data-appearance="dark">Dark</button>
      </section>

      <section class="presets" aria-label="Palettes">
        <label class="preset">
          <span>Light</span>
          <select id="preset-light"></select>
        </label>
        <label class="preset">
          <span>Dark</span>
          <select id="preset-dark"></select>
        </label>
      </section>

      <section class="site">
        <div class="site-row">
          <span>Site</span>
          <button id="site-toggle" type="button" title="Alt+Shift+B">Allowed</button>
        </div>
        <label id="x-layout-row" class="site-row x-layout" hidden>
          <span>
            <strong>Compact layout</strong>
            <small>X · desktop</small>
          </span>
          <span class="switch" aria-label="Use compact X layout">
            <input id="x-compact-layout" type="checkbox">
            <span></span>
          </span>
        </label>
      </section>

      <footer>
        <button id="options" type="button">Settings</button>
        <button id="refresh" type="button">Refresh</button>
      </footer>
    </main>
    <script src="src/content/core.js"></script>
    <script src="src/popup/popup.js"></script>
  </body>
</html>
