<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosewash</title>
    <link rel="stylesheet" href="src/popup/popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topline">
        <div><h1>Rosewash</h1><p id="host">current site</p></div>
        <label class="switch" aria-label="Enable Rosewash"><input id="enabled" type="checkbox"><span></span></label>
      </header>

      <section class="modes" aria-label="Appearance">
        <button type="button" data-appearance="auto">Auto</button>
        <button type="button" data-appearance="light">Light</button>
        <button type="button" data-appearance="dark">Dark</button>
      </section>

      <section class="presets" aria-label="Palettes">
        <label class="preset"><span>Light</span><select id="preset-light" aria-label="Light palette"></select></label>
        <label class="preset"><span>Dark</span><select id="preset-dark" aria-label="Dark palette"></select></label>
      </section>

      <section class="site" aria-label="Current site">
        <div class="site-row"><span>Site</span><span class="site-actions"><button id="pick-element" type="button" aria-label="Pick element">Pick</button><button id="site-toggle" type="button" aria-pressed="false">Allowed</button></span></div>
        <p id="site-status" role="status" hidden></p>
        <label id="x-layout-row" class="site-row layout-row" hidden>
          <span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.4l7.3-8.5L1 2h6.5l5.2 6.9L18.9 2zm-1.1 18h1.7L6.6 3.9H4.8L17.8 20z"/></svg><strong>Compact layout</strong></span>
          <span class="switch"><input id="x-compact-layout" type="checkbox" aria-label="Compact X layout"><span></span></span>
        </label>
        <label id="zhihu-layout-row" class="site-row layout-row" hidden>
          <span><strong>知乎</strong></span>
          <span class="switch"><input id="zhihu-article-layout" type="checkbox" aria-label="知乎布局"><span></span></span>
        </label>
      </section>

      <footer><button id="options" type="button">Settings</button><button id="refresh" type="button" title="Reapply settings to open pages">Refresh</button></footer>
      <p id="save-status" role="status" aria-live="polite"></p>
    </main>
    <script src="src/content/core.js"></script>
    <script src="src/popup/popup.js"></script>
  </body>
</html>
