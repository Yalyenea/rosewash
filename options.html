<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosewash Settings</title>
    <link rel="stylesheet" href="src/options/options.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="brand">
          <h1>Rosewash</h1>
          <span>Settings</span>
        </div>
        <label class="master-toggle">
          <span>Enabled</span>
          <span class="toggle">
            <input id="enabled" type="checkbox" aria-label="Enable Rosewash">
            <span class="toggle-track">
            </span>
          </span>
        </label>
      </header>
      <nav class="tabs" aria-label="Settings sections">
        <button type="button" data-panel="appearance" aria-current="page">Theme</button>
        <button type="button" data-panel="fonts">Fonts</button>
        <button type="button" data-panel="sites">Sites</button>
        <button type="button" data-panel="shortcuts">Shortcuts</button>
      </nav>
      <div class="tab-content">
        <section id="appearance" class="tab-panel" aria-label="Theme">
          <label class="setting-row">
            <h3>Override theme</h3>
            <span class="toggle">
              <input id="color-overrides-enabled" type="checkbox" aria-label="Override theme">
              <span class="toggle-track"></span>
            </span>
          </label>
          <div class="setting-row mode-row">
            <div>
              <h3>Theme mode</h3>
            </div>
            <div class="modes" aria-label="Appearance">
              <label>
                <input name="appearance" type="radio" value="auto">
                <span>Auto</span>
              </label>
              <label>
                <input name="appearance" type="radio" value="light">
                <span>Light</span>
              </label>
              <label>
                <input name="appearance" type="radio" value="dark">
                <span>Dark</span>
              </label>
            </div>
          </div>
          <div class="palette-columns">
            <section class="palette-group" data-variant="light">
              <div class="palette-title">
                <span class="palette-caption">Light palette</span>
                <span class="selected-name">Rose Pine</span>
              </div>
              <div class="palette-options">
                <div id="preset-light-list" class="preset-list" role="listbox" aria-label="Light palette">
                </div>
              </div>
            </section>
            <section class="palette-group" data-variant="dark">
              <div class="palette-title">
                <span class="palette-caption">Dark palette</span>
                <span class="selected-name">Rose Pine</span>
              </div>
              <div class="palette-options">
                <div id="preset-dark-list" class="preset-list" role="listbox" aria-label="Dark palette">
                </div>
              </div>
            </section>
          </div>
          <div class="settings-group images">
            <div class="setting-row">
              <label for="dim-images">
                <h3>Dim images</h3>
              </label>
              <div class="image-controls">
                <span class="toggle">
                  <input id="dim-images" type="checkbox" aria-label="Dim images">
                  <span class="toggle-track">
                  </span>
                </span>
                <input id="image-brightness" aria-label="Image brightness" type="range" min="0" max="2" step="1" value="1">
                <output id="image-brightness-value" for="image-brightness">80%</output>
              </div>
            </div>
            <span id="dim-status" hidden>
            </span>
          </div>
        </section>
        <section id="fonts" class="tab-panel" aria-label="Fonts" hidden>
          <label class="setting-row">
            <span>
              <h3>Override fonts</h3>
            </span>
            <span class="toggle">
              <input id="custom-fonts-enabled" type="checkbox" aria-label="Override fonts">
              <span class="toggle-track">
              </span>
            </span>
          </label>
          <div class="font-columns">
            <div class="font-field">
              <label class="setting-label" for="font-english">English</label>
              <select id="font-english" aria-label="English"><option value="">Page default</option></select>
              <small id="font-status-english" aria-live="polite"></small>
              <span id="font-preview-english" class="font-preview" lang="en">Aa Bb Cc · 0123456789</span>
            </div>
            <div class="font-field">
              <label class="setting-label" for="font-chinese">Chinese</label>
              <select id="font-chinese" aria-label="Chinese"><option value="">Page default</option></select>
              <small id="font-status-chinese" aria-live="polite"></small>
              <span id="font-preview-chinese" class="font-preview" lang="zh-CN">中文字体 · 你好世界</span>
            </div>
            <div class="font-field">
              <label class="setting-label" for="font-math">MathML</label>
              <select id="font-math" aria-label="MathML"><option value="">Page default</option></select>
              <small id="font-status-math" aria-live="polite"></small>
              <math id="font-preview-math" class="font-preview">
                <msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>z</mi><mn>2</mn></msup>
              </math>
            </div>
            <div class="font-field">
              <label class="setting-label" for="font-monospace">Monospace</label>
              <select id="font-monospace" aria-label="Monospace"><option value="">Page default</option></select>
              <small id="font-status-monospace" aria-live="polite"></small>
              <code id="font-preview-monospace" class="font-preview">const n = 42;</code>
            </div>
          </div>
          <p id="font-list-status" class="font-help" role="status"></p>
        </section>
        <section id="sites" class="tab-panel" aria-label="Sites" hidden>
  <label class="setting-row default-row">
    <span>
      <h3>Enable new sites</h3>
    </span>
    <span class="toggle">
      <input id="default-enabled" type="checkbox" aria-label="Enable new sites">
      <span class="toggle-track">
      </span>
    </span>
  </label>
  <div class="subheading">
    <h3>Clean Layout</h3>
  </div>
  <div class="layout-columns">
    <div class="layout-card">
      <label class="site-layout-toggle">
        <strong class="site-identity">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.4l7.3-8.5L1 2h6.5l5.2 6.9L18.9 2zm-1.1 18h1.7L6.6 3.9H4.8L17.8 20z"/>
          </svg>
          <span>X.com</span>
        </strong>
        <span class="toggle">
          <input id="x-compact-layout" type="checkbox" aria-label="Compact X layout">
          <span class="toggle-track">
          </span>
        </span>
      </label>
      <label class="site-width-control" for="x-single-column-width">
        <span class="site-width-heading">
          <span>Column width</span>
          <output id="x-single-column-width-value" for="x-single-column-width">600 px</output>
        </span>
        <input id="x-single-column-width" aria-label="Column width" type="range" min="0" max="3" step="1" value="1">
      </label>
      <label class="site-layout-toggle reply-text-toggle" title="Read full replies on post pages.">
        <span>Auto-expand reply text</span>
        <span class="toggle">
          <input id="x-auto-expand-replies" type="checkbox" aria-label="Auto-expand reply text">
          <span class="toggle-track"></span>
        </span>
      </label>
    </div>
    <div class="layout-card">
      <label class="site-layout-toggle">
        <strong class="site-identity">
          <span>知乎</span>
          <span class="site-domain">zhihu.com</span>
        </strong>
        <span class="toggle">
          <input id="zhihu-article-layout" type="checkbox" aria-label="知乎布局">
          <span class="toggle-track">
          </span>
        </span>
      </label>
      <label class="site-width-control" for="zhihu-article-width">
        <span class="site-width-heading">
          <span>Column width</span>
          <output id="zhihu-article-width-value" for="zhihu-article-width">960 px</output>
        </span>
        <input id="zhihu-article-width" aria-label="Column width" type="range" min="0" max="3" step="1" value="1">
      </label>
    </div>
  </div>
  <div class="subheading rules-heading">
    <h3>Site rules</h3>
  </div>
  <div class="rules-columns">
    <label>
      <span>Always on</span>
      <textarea id="enabled-hosts" aria-label="Always enabled sites" spellcheck="false" placeholder="example.com">
      </textarea>
    </label>
    <label>
      <span>Always off</span>
      <textarea id="disabled-hosts" aria-label="Always disabled sites" spellcheck="false" placeholder="example.com">
      </textarea>
    </label>
  </div>
  <details class="ignored-panel">
    <summary>
      <span>Ignored elements</span>
      <span class="chevron">
      </span>
    </summary>
    <div id="ignored-list">
    </div>
  </details>
</section>
<section id="shortcuts" class="tab-panel" aria-label="Shortcuts" hidden>
  <div class="shortcut-list">
    <div class="shortcut-row">
      <span>
        <h3>Toggle current site</h3>
      </span>
      <kbd id="shortcut-site" aria-live="polite">Not set</kbd>
    </div>
    <div class="shortcut-row">
      <span>
        <h3>Pause Rosewash</h3>
      </span>
      <kbd id="shortcut-global" aria-live="polite">Not set</kbd>
    </div>
  </div>
  <button id="edit-shortcut" class="secondary" type="button">Change shortcuts ↗</button>
  <p id="shortcut-help" class="font-help" role="status"></p>
</section>
</div>
<div id="status" class="save-feedback" role="status" aria-live="polite">
</div>
</main>
<script src="src/content/core.js">
</script>
<script src="src/settings/fonts.js">
</script>
<script src="src/options/options.js">
</script>
</body>
</html>
