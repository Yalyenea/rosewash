<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosewash Settings</title>
    <link rel="stylesheet" href="src/options/options.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">Settings</p>
          <h1>Rosewash</h1>
        </div>
        <label class="master-toggle">
          <span>Enabled</span>
          <span class="toggle">
            <input id="enabled" type="checkbox">
            <span class="toggle-track"></span>
          </span>
        </label>
      </header>

      <section class="panel general-panel">
        <div class="section-heading">
          <h2>General</h2>
        </div>
        <div class="setting-row">
          <span class="setting-label">Appearance</span>
          <div class="modes" aria-label="Appearance">
            <label>
              <input name="appearance" type="radio" value="auto">
              <span>Auto</span>
            </label>
            <label>
              <input name="appearance" type="radio" value="light">
              <span>Light</span>
            </label>
            <label>
              <input name="appearance" type="radio" value="dark">
              <span>Dark</span>
            </label>
          </div>
        </div>
      </section>

      <section class="panel theme-panel">
        <div class="section-heading">
          <h2>Theme</h2>
        </div>
        <div class="palette-columns">
          <div class="palette-group">
            <h3>Light palette</h3>
            <div id="preset-light-list" class="preset-list" role="listbox" aria-label="Light palette"></div>
          </div>
          <div class="palette-group">
            <h3>Dark palette</h3>
            <div id="preset-dark-list" class="preset-list" role="listbox" aria-label="Dark palette"></div>
          </div>
        </div>
      </section>

      <section class="panel sites-panel">
        <div class="section-heading">
          <h2>Sites</h2>
        </div>
        <div class="site-columns">
          <div class="site-group">
            <h3>Site layouts</h3>
            <div class="site-layout">
              <label class="site-layout-toggle">
                <span>
                  <strong>X · Compact layout</strong>
                  <small>Compact navigation, center single-column streams, and split thread pages on desktop.</small>
                </span>
                <span class="toggle">
                  <input id="x-compact-layout" type="checkbox">
                  <span class="toggle-track"></span>
                </span>
              </label>
              <label class="x-width-control" for="x-single-column-width">
                <span class="x-width-heading">
                  <strong>Single-column width</strong>
                  <output id="x-single-column-width-value" for="x-single-column-width">600 px</output>
                </span>
                <input id="x-single-column-width" type="range" min="0" max="3" step="1" value="1">
                <span class="x-width-stops" aria-hidden="true">
                  <span>520</span>
                  <span>600</span>
                  <span>680</span>
                  <span>760</span>
                </span>
              </label>
            </div>
          </div>
          <label class="site-group blocked-sites">
            <h3>Blocked sites</h3>
            <textarea id="disabled-hosts" spellcheck="false" placeholder="example.com"></textarea>
          </label>
        </div>
      </section>

      <footer class="actions">
        <span id="status" role="status"></span>
        <button id="reset" type="button">Reset</button>
        <button id="save" type="button">Save</button>
      </footer>
    </main>
    <script src="src/content/core.js"></script>
    <script src="src/options/options.js"></script>
  </body>
</html>
