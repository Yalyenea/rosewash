name: Release Zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
        type: string
      store:
        description: Store uploads to run after packaging
        type: choice
        default: all
        options: [all, chrome, edge, firefox, none]
      submit:
        description: Submit uploaded packages for store review
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension zip
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -LsSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Build release zips
        run: just package-all

      - name: Name release asset
        id: asset
        run: |
          case "$TAG_NAME" in
            v*) ;;
            *) echo "Release tags must start with v, got: $TAG_NAME" >&2; exit 1 ;;
          esac

          for suffix in "" "-edge" "-firefox" "-chromium-themes"; do
            asset="release/rosewash-${TAG_NAME}${suffix}.zip"
            if [[ ! -f "$asset" ]]; then
              echo "missing $asset" >&2
              exit 1
            fi
          done

      - name: Write release notes
        id: notes
        run: |
          mkdir -p .tmp
          notes=".tmp/release-notes.md"
          node scripts/release-notes.mjs "$TAG_NAME" > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Rosewash ${TAG_NAME}" --notes-file "${{ steps.notes.outputs.path }}"
            gh release upload "$TAG_NAME" release/rosewash-"${TAG_NAME}"*.zip --clobber
          else
            gh release create "$TAG_NAME" release/rosewash-"${TAG_NAME}"*.zip \
              --title "Rosewash ${TAG_NAME}" \
              --notes-file "${{ steps.notes.outputs.path }}" \
              --verify-tag
          fi

  chrome:
    needs: release
    if: ${{ github.event_name == 'push' || inputs.store == 'all' || inputs.store == 'chrome' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/store-chrome.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      submit: ${{ github.event_name == 'push' || inputs.submit }}

  edge:
    needs: release
    if: ${{ github.event_name == 'push' || inputs.store == 'all' || inputs.store == 'edge' }}
    permissions:
      contents: read
    uses: ./.github/workflows/store-edge.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      submit: ${{ github.event_name == 'push' || inputs.submit }}
    secrets: inherit

  firefox:
    needs: release
    if: ${{ github.event_name == 'push' || inputs.store == 'all' || inputs.store == 'firefox' }}
    permissions:
      contents: read
    uses: ./.github/workflows/store-firefox.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      submit: ${{ github.event_name == 'push' || inputs.submit }}
    secrets: inherit
